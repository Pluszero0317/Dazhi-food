<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0E6B5A">
<meta name="apple-mobile-web-app-title" content="大直吃喝">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-48.png" type="image/png" sizes="48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>實踐大直吃喝地圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700;900&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column. Sticky search + horizontally scrolling type chips; menu-style cards with dotted price leaders; fixed bottom "random pick" button opens a bottom sheet. */
:root{
  --bg:#F1F4F0; --surface:#FFFFFF; --fg:#16231F; --muted:#5B6B65; --line:#D5DDD7;
  --accent:#0E6B5A; --accent-ink:#FFFFFF; --price:#B8420F; --ok:#16794A; --off:#8A6A1F; --chip:#E3EBE5; --shade:rgba(10,20,16,.45);
  --serif:"Noto Serif TC","Songti TC",serif; --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1815; --surface:#17231F; --fg:#E6EFEA; --muted:#93A59D; --line:#2A3A34;
  --accent:#4FC3A8; --accent-ink:#06211A; --price:#F2A06A; --ok:#5ED19A; --off:#E0B45A; --chip:#223330; --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1815; --surface:#17231F; --fg:#E6EFEA; --muted:#93A59D; --line:#2A3A34;
  --accent:#4FC3A8; --accent-ink:#06211A; --price:#F2A06A; --ok:#5ED19A; --off:#E0B45A; --chip:#223330; --shade:rgba(0,0,0,.6); color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
.wrap{max-width:1100px;margin-inline:auto;padding-inline:16px}
header.top{padding-block:20px 12px}
h1{font-family:var(--serif);font-weight:900;font-size:clamp(26px,7vw,44px);line-height:1.15;margin:4px 0 6px;text-wrap:balance}
.lede{color:var(--muted);margin:0;font-size:14px;max-width:60ch}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-block:1px solid var(--line);padding-block:10px}
.bar .wrap{display:grid;gap:8px}
.row{display:flex;gap:8px;align-items:center;min-width:0}
.scroll{overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;padding-bottom:2px}
.scroll::-webkit-scrollbar{display:none}
.scroll > *{flex:none}
input[type=search],select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:44px}
input[type=search]{flex:1 1 auto;min-width:0}
select{flex:0 0 auto;max-width:44%}
.chip{font:inherit;font-size:14px;color:var(--fg);background:var(--chip);border:1px solid transparent;border-radius:999px;padding:7px 14px;min-height:38px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.chip.line{background:transparent;border-color:var(--line)}
.chip.line[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}
.lbl{font-size:12px;color:var(--muted);letter-spacing:.08em;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.count{font-size:13px;color:var(--muted);padding-block:14px 8px}
.grid{display:grid;grid-template-columns:1fr;gap:12px;padding-bottom:110px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font-family:var(--serif);font-size:19px;line-height:1.3;margin:0;font-weight:700}
.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.head > div{min-width:0}
.tag{font-size:12px;color:var(--muted);margin-top:2px}
.fav{font:inherit;font-size:13px;font-weight:700;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--fg);cursor:pointer;white-space:nowrap;flex:none}
.fav[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card .more .mr{display:flex;align-items:center;gap:10px}
.detail .dh .fav{margin-left:auto}
.linkbtn{font:inherit;font-size:14px;font-weight:700;color:var(--accent);background:none;border:0;padding:8px 0;cursor:pointer;text-decoration:underline;white-space:nowrap}
.shade.top{z-index:11}.sheet.top{z-index:12}
.rname{font-weight:700;color:var(--muted);margin:2px 0 0}
.rtypes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
#rtext{display:block;width:100%;font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:96px;resize:vertical}
.rmsg{font-size:13px;color:var(--muted);min-height:1.4em;margin-top:8px}
.upd{position:fixed;left:12px;right:12px;top:calc(10px + env(safe-area-inset-top,0px));z-index:20;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;display:flex;gap:10px;align-items:center;justify-content:space-between;box-shadow:0 6px 20px rgba(0,0,0,.28);font-size:14px;max-width:560px;margin-inline:auto}
.upd button{font:inherit;font-weight:700;min-height:36px;padding:0 14px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer;flex:none}
.grid[hidden],#map[hidden]{display:none}
body.mapmode .fabs{display:none}
#map{height:420px;margin-bottom:60px;border:1px solid var(--line);border-radius:8px;position:relative;z-index:0;isolation:isolate;background:var(--chip)}
#map .empty{padding:40px 16px}
#map.leaflet-container{font:inherit}
#map .leaflet-popup-content-wrapper{background:var(--surface);color:var(--fg);border-radius:10px}
#map .leaflet-popup-tip{background:var(--surface)}
#map .leaflet-popup-content{margin:12px 14px;font-size:14px;line-height:1.5}
#map .leaflet-popup-close-button{width:32px;height:32px;font-size:22px;line-height:30px;color:var(--muted)}
.mp b{font-family:var(--serif);font-size:16px;display:block;padding-right:18px}
.mp .tag{margin:2px 0}
.mp ul.menu{margin:8px 0}
.mp ul.menu li{font-size:13px}
.mp .badges{margin:6px 0 4px}
.mpa{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:8px}
.mpbtn{font:inherit;font-size:14px;font-weight:700;min-height:36px;padding:0 12px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.pin{background:none;border:0}
.pin i{position:absolute;left:0;top:0;width:24px;height:24px;background:var(--accent);border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.pin i::after{content:"";position:absolute;left:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#fff}
.pin.drink i{background:var(--price)}
.campus{background:none;border:0}
.campus span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:var(--fg);color:var(--bg);font-weight:700;font-size:12px;padding:3px 9px;border-radius:999px;box-shadow:0 2px 6px rgba(0,0,0,.4);border:2px solid #fff}
.zhn{color:var(--muted);font-size:.82em}
.range.hrs{white-space:nowrap}.range.hrs,.range.na{text-align:right;line-height:1.4}.range.na{color:var(--muted);font-family:var(--sans);font-weight:400;font-size:12px;max-width:6.5em}
.range{font-family:var(--mono);font-weight:600;color:var(--price);font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
ul.menu{list-style:none;margin:0;padding:0;display:grid;gap:4px}
ul.menu li{display:flex;align-items:baseline;gap:6px;font-size:14px}
ul.menu li > span:first-child{min-width:0}
ul.menu .dots{flex:1;border-bottom:1.5px dotted var(--line);transform:translateY(-3px);min-width:10px}
ul.menu .pr{font-family:var(--mono);color:var(--price);font-variant-numeric:tabular-nums;white-space:nowrap}
.note{font-size:12.5px;color:var(--muted)}
.meta{display:grid;gap:3px;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:auto}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.b{font-size:12px;padding:1px 8px;border-radius:4px;border:1px solid var(--line)}
.b.open{color:var(--ok);border-color:var(--ok)} .b.closed{color:var(--off);border-color:var(--off)}
.b.walk{color:var(--accent);border-color:var(--accent)}
a.map{color:var(--accent);font-weight:700;text-decoration:none;white-space:nowrap}
details.full{border:1px solid var(--line);border-radius:6px;padding:0 12px}
details.full summary{cursor:pointer;font-weight:700;color:var(--accent);font-size:14px;min-height:44px;display:flex;align-items:center}
details.full[open] summary{border-bottom:1px solid var(--line);margin-bottom:4px}
details.full h3{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:14px 0 6px;font-weight:700}
details.full .src{font-size:12px;color:var(--muted);margin:12px 0}
.empty{padding:60px 0;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--line);padding-block:20px 120px;color:var(--muted);font-size:13px}
footer p{margin:0 0 8px;max-width:75ch}
footer a{color:var(--accent);font-weight:700;text-decoration:none}
.fabs{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;gap:10px;padding:0 16px;pointer-events:none}.fab{pointer-events:auto;display:flex;align-items:center;gap:8px;font:inherit;font-weight:700;font-size:16px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:0 24px;min-height:52px;box-shadow:0 6px 20px rgba(0,0,0,.28);cursor:pointer}
.fab{min-width:0}.fab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}@media (max-width:420px){.fab{padding:0 16px;gap:6px;font-size:15px}.fab svg{width:20px;height:20px}}
.fab svg{width:22px;height:22px}.fab#rand-drink{background:var(--fg);color:var(--bg)}
.shade{position:fixed;inset:0;background:var(--shade);z-index:8}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--bg);border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;max-width:560px;margin-inline:auto}
.sheet .pick{font-family:var(--serif);font-size:28px;font-weight:900;text-align:center;padding-block:6px 14px;min-height:60px;text-wrap:balance}
.sheet .pick.spin{color:var(--muted)}
.sheet .acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sheet .acts button{font:inherit;font-weight:700;min-height:48px;border-radius:10px;cursor:pointer;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
.sheet .acts button.go{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--chip);padding:4px;border-radius:12px}
.seg button{font:inherit;font-weight:700;font-size:15px;min-height:42px;border:0;border-radius:9px;background:transparent;color:var(--fg);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.card{cursor:pointer;transition:border-color .15s}
.card:hover{border-color:var(--accent)}
.card .more{color:var(--accent);font-weight:700;font-size:14px;display:flex;justify-content:space-between;align-items:center;min-height:32px}
.card .hit{font-size:12px;color:var(--muted);margin-bottom:-4px}
mark{background:color-mix(in srgb,var(--price) 22%,transparent);color:inherit;border-radius:3px;padding:0 2px}
.detail{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.detail .dh{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 16px}
.detail .dh .wrap2{max-width:760px;margin-inline:auto;display:flex;align-items:center;gap:10px}
.detail .back{font:inherit;font-weight:700;color:var(--accent);background:var(--chip);border:0;border-radius:999px;min-height:44px;padding:0 16px;cursor:pointer;flex:none}
.detail .dt{font-family:var(--serif);font-weight:700;font-size:18px;line-height:1.3;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.detail .body{max-width:760px;margin-inline:auto;padding:16px 16px 60px;display:grid;gap:14px}
.detail .info{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:6px;font-size:14px}
.detail .jump{position:sticky;top:61px;z-index:1;background:var(--bg);padding-block:6px}
.detail section{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 14px 14px;scroll-margin-top:120px}
.detail section h3{font-size:13px;letter-spacing:.08em;color:var(--accent);margin:12px 0 8px;font-weight:700}
.detail ul.menu li{font-size:15px;padding-block:2px}
.detail .src{font-size:12.5px;color:var(--muted)}
@media (min-width:700px){
  body{font-size:16px}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
  .card{padding:16px}
}
@media (min-width:1000px){ .grid{grid-template-columns:repeat(3,minmax(0,1fr))} }
:root[data-pal="milk"]{--bg:#F6EFE6;--surface:#FFFBF5;--fg:#3A2A1E;--muted:#75624F;--line:#E3D6C4;--accent:#8A5A2B;--accent-ink:#FFFFFF;--price:#B23A1E;--ok:#2F7D4F;--off:#8A6A1F;--chip:#EADFCF;--shade:rgba(0,0,0,0.4);color-scheme:light}
:root[data-pal="sakura"]{--bg:#FBEFF1;--surface:#FFFFFF;--fg:#3B1F2A;--muted:#7A5663;--line:#EBD2D9;--accent:#C2386B;--accent-ink:#FFFFFF;--price:#B3361F;--ok:#2F7D4F;--off:#8A6A1F;--chip:#F4DDE3;--shade:rgba(0,0,0,0.4);color-scheme:light}
:root[data-pal="ocean"]{--bg:#EDF3F9;--surface:#FFFFFF;--fg:#12263A;--muted:#52677D;--line:#D0DCE8;--accent:#1F5FA8;--accent-ink:#FFFFFF;--price:#B8420F;--ok:#1F7A4D;--off:#8A6A1F;--chip:#DCE7F2;--shade:rgba(0,0,0,0.4);color-scheme:light}
:root[data-pal="lemon"]{--bg:#FBF7E4;--surface:#FFFEF6;--fg:#2B2A14;--muted:#6B6A3E;--line:#E6E0B3;--accent:#8A6D00;--accent-ink:#FFFFFF;--price:#B8420F;--ok:#3A7D2F;--off:#8A6A1F;--chip:#F0EAC4;--shade:rgba(0,0,0,0.4);color-scheme:light}
:root[data-pal="lav"]{--bg:#F3F0FA;--surface:#FFFFFF;--fg:#231B3A;--muted:#62597D;--line:#DDD6EE;--accent:#6B46C1;--accent-ink:#FFFFFF;--price:#B8420F;--ok:#2F7D4F;--off:#8A6A1F;--chip:#E6E0F5;--shade:rgba(0,0,0,0.4);color-scheme:light}
:root[data-pal="coral"]{--bg:#FFF1EA;--surface:#FFFFFF;--fg:#3A1E12;--muted:#7A5646;--line:#F0D5C8;--accent:#C2410C;--accent-ink:#FFFFFF;--price:#9A3412;--ok:#2F7D4F;--off:#8A6A1F;--chip:#F8E0D4;--shade:rgba(0,0,0,0.4);color-scheme:light}
:root[data-pal="mono"]{--bg:#F2F2F2;--surface:#FFFFFF;--fg:#1A1A1A;--muted:#606060;--line:#D9D9D9;--accent:#2B2B2B;--accent-ink:#FFFFFF;--price:#B8420F;--ok:#2F7D4F;--off:#8A6A1F;--chip:#E6E6E6;--shade:rgba(0,0,0,0.4);color-scheme:light}
:root[data-pal="night"]{--bg:#0B1220;--surface:#131C2E;--fg:#E4ECF8;--muted:#94A3BC;--line:#243049;--accent:#6AA8FF;--accent-ink:#07162E;--price:#F2A06A;--ok:#5ED19A;--off:#E0B45A;--chip:#1B2740;--shade:rgba(0,0,0,0.6);color-scheme:dark}
:root[data-pal="cafe"]{--bg:#17110C;--surface:#221A13;--fg:#F1E6D8;--muted:#B19E88;--line:#3A2D22;--accent:#E0A25A;--accent-ink:#2A1707;--price:#F2A06A;--ok:#5ED19A;--off:#E0B45A;--chip:#2E231A;--shade:rgba(0,0,0,0.6);color-scheme:dark}
:root[data-pal="violet"]{--bg:#14101F;--surface:#1E1830;--fg:#EBE6F8;--muted:#A59BC4;--line:#31294A;--accent:#B592FF;--accent-ink:#1A0F36;--price:#F2A06A;--ok:#5ED19A;--off:#E0B45A;--chip:#272040;--shade:rgba(0,0,0,0.6);color-scheme:dark}
:root[data-pal="black"]{--bg:#000000;--surface:#0E0E0E;--fg:#EDEDED;--muted:#9A9A9A;--line:#262626;--accent:#FFD166;--accent-ink:#1A1200;--price:#F2A06A;--ok:#5ED19A;--off:#E0B45A;--chip:#1A1A1A;--shade:rgba(0,0,0,0.6);color-scheme:dark}
:root[data-pal="forest"]{--bg:#0C1710;--surface:#14231A;--fg:#E3F1E6;--muted:#93AE9B;--line:#25392B;--accent:#7ED38F;--accent-ink:#08210F;--price:#F2A06A;--ok:#7ED38F;--off:#E0B45A;--chip:#1D3324;--shade:rgba(0,0,0,0.6);color-scheme:dark}
:root[data-pal="rose"]{--bg:#1C0F14;--surface:#2A1720;--fg:#F7E6EB;--muted:#BE9AA7;--line:#43232F;--accent:#FF8FAB;--accent-ink:#3A0A1A;--price:#F2A06A;--ok:#5ED19A;--off:#E0B45A;--chip:#3A1E29;--shade:rgba(0,0,0,0.6);color-scheme:dark}
.tools{display:flex;justify-content:flex-end;gap:8px;margin-bottom:6px}
.palbtn{font:inherit;font-size:13px;font-weight:700;min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;display:flex;align-items:center;gap:6px}
.palbtn i{width:14px;height:14px;border-radius:50%;background:var(--accent);display:inline-block}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}
.pgrid h3{grid-column:1/3;margin:6px 0 0;font-size:12px;letter-spacing:.12em;color:var(--muted)}
.pgrid button{font:inherit;font-weight:700;min-height:48px;border-radius:10px;cursor:pointer;border:2px solid var(--line);display:flex;align-items:center;gap:8px;padding:6px 10px;text-align:left}
.pgrid button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.pgrid button i{width:22px;height:22px;border-radius:50%;flex:none;border:2px solid currentColor}
.palt{font-family:var(--serif);font-weight:900;font-size:20px;margin:0}
</style>
</head>
<body>

<header class="top"><div class="wrap">
  <div class="tools"><button class="palbtn" id="langbtn" type="button">EN</button><button class="palbtn" id="palbtn" type="button" aria-haspopup="dialog"><i></i><span data-l="pal">配色</span></button></div>
  <h1 data-l="title">實踐大直吃喝地圖</h1>
  <p class="lede" data-l="lede">校門口往外步行約 15 分鐘內的餐廳和手搖飲。點進店家看完整菜單，選不出來就按下方的隨機按鈕。</p>
</div></header>

<div class="bar"><div class="wrap">
  <div class="seg" id="cat" role="group" aria-label="大類"><button type="button" data-c="food" aria-pressed="true" data-l="food">食物</button><button type="button" data-c="drink" aria-pressed="false" data-l="drinkTab">手搖飲</button></div>
  <div class="row">
    <input type="search" id="q" placeholder="搜尋店名或品項" aria-label="搜尋店名或品項" enterkeyhint="search">
    <select id="sort" aria-label="排序">
      <option value="walk" data-l="sortWalk">距離近到遠</option>
      <option value="pasc" data-l="sortPasc">價格低到高</option>
      <option value="pdesc" data-l="sortPdesc">價格高到低</option>
      <option value="name" data-l="sortName">店名</option>
    </select>

const parseList=str=>str.split("|").map(x=>{
  const m=x.trim().match(/^(.+?)\s+(\d+(?:[\/–]\d+)*)(起)?$/);
  if(!m) throw new Error("bad item: "+x);
  const nums=m[2].split(/[\/–]/).map(Number),slash=m[2].includes("/");
  return{n:m[1],min:Math.min(...nums),max:Math.max(...nums),txt:nums.length>1?nums.join(slash?"／":"–")+(m[3]||""):String(nums[0])+(m[3]||"")};
});
const CAMPUS=[25.0837391,121.546091];
const walkMin=ll=>{const R=6371000,r=Math.PI/180,dy=(ll[0]-CAMPUS[0])*r*R,dx=(ll[1]-CAMPUS[1])*r*R*Math.cos(25.08*r);return Math.max(1,Math.round(Math.hypot(dx,dy)*1.3/75))};
D.forEach((s,i)=>{
  s.id=i;s.drink=s.ty==="手搖飲";
  s.w=walkMin(s.ll);
  s.cats=s.m.map(([c,l])=>[c,parseList(l)]);
  s.all=s.cats.flatMap(c=>c[1]);
  s.min=s.all.length?Math.min(...s.all.map(x=>x.min)):null;s.max=s.all.length?Math.max(...s.all.map(x=>x.max)):null;
  s.top=s.hl?parseList(s.hl):s.all.slice(0,3);
});

function taipeiNow(){const p=new Intl.DateTimeFormat("en-US",{timeZone:"Asia/Taipei",weekday:"short",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(new Date());
  const g=t=>p.find(x=>x.type===t).value;return{day:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].indexOf(g("weekday")),min:(+g("hour")%24)*60+ +g("minute")}}
const tm=s=>{const[a,b]=s.split(":");return +a*60+ +b};
function status(s,now){if(!s.h)return null;
  const hours=(s.hd&&s.hd[now.day])||s.h;
  if(s.off&&s.off.includes(now.day))return false;
  return hours.split(",").some(r=>{const[o,c]=r.split("-").map(tm);return c<=o?(now.min>=o||now.min<c):(now.min>=o&&now.min<c)})}
const esc=x=>String(x).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mk=(t,q)=>{if(!q)return esc(t);const i=t.toLowerCase().indexOf(q);return i<0?esc(t):esc(t.slice(0,i))+"<mark>"+esc(t.slice(i,i+q.length))+"</mark>"+esc(t.slice(i+q.length))};
const li=(x,q)=>`<li><span>${lang==="en"&&EN_I[x.n]?mk(EN_I[x.n],q)+` <small class="zhn">${mk(x.n,q)}</small>`:mk(x.n,q)}</span><span class="dots"></span><span class="pr">$${esc(x.txt)}</span></li>`;
const DN="日一二三四五六";
const hoursText=s=>T("hours")(s);
const badgeOf=(s,now)=>{const so=status(s,now);return so==null?"":so?`<span class="b open">${T("open")}</span>`:`<span class="b closed">${T("closed")}</span>`};
function cardHours(s,now){
  if(!s.h)return `<span class="range na">${T("hoursNA")}</span>`;
  if(s.off&&s.off.includes(now.day))return `<span class="range na">${T("offToday")}</span>`;
  const h=(s.hd&&s.hd[now.day])||s.h;
  return `<span class="range hrs">${h.split(",").map(r=>esc(r.replace("-","–"))).join("<br>")}</span>`}
function cardHTML(s,now,q){
  const range=cardHours(s,now);
  let hit="",items=[];
  if(q){const m=s.all.filter(x=>nameText(x).toLowerCase().includes(q));if(m.length){items=m.slice(0,3);hit=`<div class="hit">${T("hit")(esc(q),m.length)}</div>`}}
  return `<article class="card" data-i="${s.id}" role="button" tabindex="0" aria-label="${esc(T("view")(s.n))}"><div class="head"><div><h2>${esc(s.n)}</h2><div class="tag">${esc(tyL(s.ty))}${SEP()}${esc(descOf(s))}</div></div>${range}</div>
  ${hit}${items.length?`<ul class="menu">${items.map(x=>li(x,q)).join("")}</ul>`:""}
  <div class="meta"><div class="badges"><span class="b walk">${T("walk")(s.w)}</span>${badgeOf(s,now)}${s.part?`<span class="b">${T("partial")}</span>`:""}</div></div>
  <div class="more"><span>${s.all.length?T("more")(s.all.length):T("moreInfo")}</span><span class="mr">${favBtn(s)}<span aria-hidden="true">›</span></span></div></article>`}

    if(st.open&&status(s,now)!==true)return false;if(st.fav&&!favs.has(s.n))return false;return true});
  const k=$("sort").value;
  list.sort((a,b)=>k==="name"?a.n.localeCompare(b.n,"zh-Hant"):k==="walk"?a.w-b.w||a.n.localeCompare(b.n,"zh-Hant"):k==="pasc"?(a.min??1e9)-(b.min??1e9):(b.max??-1)-(a.max??-1));
  current=list;

/* 隨機挑選 */
const sheet=$("sheet"),shade=$("shade");
let timer=null;
let lastBtn=null,pickKind="food";
function closeSheet(keep){clearInterval(timer);sheet.hidden=true;shade.hidden=true;sheet.classList.remove("top");shade.classList.remove("top");if(!keep&&lastBtn)lastBtn.focus()}
function pickOne(kind){
  kind=kind||pickKind;pickKind=kind;
  const ft=(kind==="food"&&st.cat==="food")?st.ty:"全部";
  const pool=D.filter(s=>kind==="drink"?s.drink:(!s.drink&&(ft==="全部"||s.ty===ft))).filter(s=>!st.fav||favs.has(s.n));
  clearInterval(timer);
  if(!pool.length){sheet.innerHTML=`<div class="pick">${T("noPool")}</div><div class="acts"><button type="button" id="sc" style="grid-column:1/3">${T("close")}</button></div>`;$("sc").onclick=()=>closeSheet();sheet.hidden=false;shade.hidden=false;return}
  const final=pool[Math.floor(Math.random()*pool.length)];
  sheet.innerHTML=`<div class="pick spin" id="pk">…</div><div id="res"></div><div class="acts"><button type="button" id="again">${T("again")}</button><button type="button" class="go" id="close">${T("eat")}</button></div>`;
  sheet.hidden=false;shade.hidden=false;
  $("again").onclick=()=>pickOne(kind);$("close").onclick=()=>closeSheet();
  const reduce=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
  const show=()=>{const pk=$("pk");pk.classList.remove("spin");pk.textContent=final.n;$("res").innerHTML=cardHTML(final,taipeiNow(),"")};
  if(reduce||pool.length===1){show();return}
  let n=0;timer=setInterval(()=>{n++;$("pk").textContent=pool[Math.floor(Math.random()*pool.length)].n;if(n>=12){clearInterval(timer);show()}},70);
}
$("rand-food").onclick=e=>{lastBtn=e.currentTarget;pickOne("food")};$("rand-drink").onclick=e=>{lastBtn=e.currentTarget;pickOne("drink")};shade.onclick=()=>closeSheet();

function toggleFav(n){
  favs.has(n)?favs.delete(n):favs.add(n);

function legacyCopy(t){const a=document.createElement("textarea");a.value=t;a.style.cssText="position:fixed;opacity:0";document.body.appendChild(a);a.select();try{document.execCommand("copy")}catch(e){}a.remove()}
function copyText(t){
  try{if(navigator.clipboard&&navigator.clipboard.writeText)return navigator.clipboard.writeText(t).catch(()=>legacyCopy(t))}catch(e){}
  legacyCopy(t);return Promise.resolve()
}

/* 地圖檢視：打開時才載入 Leaflet（含完整性雜湊），底圖為 OpenStreetMap */
const LEAFLET_CSS="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css",LEAFLET_JS="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
let leafletP=null,map=null,pins=null,campusMarker=null,mapSig="";
function loadLeaflet(){
  if(window.L)return Promise.resolve();
  if(leafletP)return leafletP;
  leafletP=new Promise((res,rej)=>{
    const css=document.createElement("link");css.rel="stylesheet";css.href=LEAFLET_CSS;css.integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=";css.crossOrigin="";document.head.appendChild(css);
    const sc=document.createElement("script");sc.src=LEAFLET_JS;sc.integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=";sc.crossOrigin="";
    sc.onload=()=>res();sc.onerror=()=>{leafletP=null;sc.remove();rej(new Error("leaflet"))};document.head.appendChild(sc);
  });
  return leafletP;
}
function todayText(s,now){
  if(!s.h)return T("hoursNA");
  if(s.off&&s.off.includes(now.day))return T("offToday");
  return ((s.hd&&s.hd[now.day])||s.h).split(",").map(r=>r.replace("-","–")).join(" / ");
}
function popupHTML(s){
  const now=taipeiNow();
  return `<div class="mp"><b>${esc(s.n)}</b><div class="tag">${esc(tyL(s.ty))}${SEP()}${esc(descOf(s))}</div><div class="tag">${esc(todayText(s,now))}</div><div class="badges"><span class="b walk">${T("walk")(s.w)}</span>${badgeOf(s,now)}${s.part?`<span class="b">${T("partial")}</span>`:""}</div>${s.top.length?`<ul class="menu">${s.top.map(x=>li(x,"")).join("")}</ul>`:""}<div class="mpa"><button type="button" class="mpbtn" data-open="${s.id}">${s.all.length?T("more")(s.all.length):T("moreInfo")}</button>${favBtn(s)}</div></div>`;
}
function pinIcon(s){return L.divIcon({className:"pin"+(s.drink?" drink":""),html:"<i></i>",iconSize:[30,38],iconAnchor:[15,37],popupAnchor:[0,-34]})}
function campusIcon(){return L.divIcon({className:"campus",html:`<span>${esc(T("campus"))}</span>`,iconSize:[0,0]})}
let wasMap=false;
function fitMapBox(){$("map").style.height=Math.max(300,innerHeight-document.querySelector(".bar").offsetHeight-16)+"px"}
function showView(list){
  const m=st.view==="map";
  $("grid").hidden=m;$("map").hidden=!m;document.body.classList.toggle("mapmode",m);
  if(m){
    fitMapBox();
    if(!wasMap)window.scrollTo(0,scrollY+$("map").getBoundingClientRect().top-document.querySelector(".bar").offsetHeight-8);
    updateMap(list);
  }
  wasMap=m;
}
window.addEventListener("resize",()=>{if(st.view==="map"){fitMapBox();if(map)map.invalidateSize()}});
function updateMap(list){
  loadLeaflet().then(()=>{
    if(st.view!=="map")return;
    const box=$("map");
    if(!map){
      box.innerHTML="";
      map=L.map(box).setView(CAMPUS,17);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap contributors"}).addTo(map);
      L.circle(CAMPUS,{radius:865,color:"#0E6B5A",weight:1.5,dashArray:"6 6",fill:false,interactive:false}).addTo(map);
      pins=L.layerGroup().addTo(map);
      campusMarker=L.marker(CAMPUS,{icon:campusIcon(),zIndexOffset:1000,interactive:false}).addTo(map);
      map.on("popupopen",e=>{const el=e.popup.getElement(),b=el&&el.querySelector("[data-open]");if(b)b.onclick=()=>openDetail(+b.dataset.open)});
    }
    map.invalidateSize();
    campusMarker.setIcon(campusIcon());
    pins.clearLayers();
    list.forEach(s=>L.marker(s.ll,{icon:pinIcon(s),title:s.n}).bindPopup(()=>popupHTML(s),{maxWidth:270,minWidth:210,autoPanPadding:[16,24]}).addTo(pins));
    const sig=list.map(s=>s.id).join(",");
    if(sig!==mapSig){mapSig=sig;map.fitBounds(L.latLngBounds(list.map(s=>s.ll).concat([CAMPUS])),{padding:[28,28],maxZoom:18})}
  }).catch(()=>{if(st.view==="map")$("map").innerHTML=`<div class="empty">${T("mapOffline")}</div>`});
}

/* PWA：離線使用與自動更新。version.json 由 stamp.js 產生；開啟或回到 App 時比對，有新版就自動重新載入（正在看詳情或面板時改顯示提示條）。 */
const APP_VERSION="6be1ccf06d";
function showUpdate(){
  if(document.getElementById("upd"))return;
  const b=document.createElement("div");b.className="upd";b.id="upd";b.setAttribute("role","status");
  b.innerHTML=`<span>${T("updMsg")}</span><button type="button">${T("updBtn")}</button>`;
  b.querySelector("button").onclick=()=>location.reload();
  document.body.appendChild(b);
}
async function checkUpdate(){
  try{
    const r=await fetch("version.json?_="+Date.now(),{cache:"no-store"});if(!r.ok)return;
    const j=await r.json();if(!j.v||j.v===APP_VERSION)return;
    let tried="";try{tried=sessionStorage.getItem("reloadedFor")||""}catch(e){}
    if(detail.hidden&&sheet.hidden&&tried!==j.v){try{sessionStorage.setItem("reloadedFor",j.v)}catch(e){}location.reload()}
    else showUpdate();
  }catch(e){}
}
if("serviceWorker" in navigator&&/^https?:$/.test(location.protocol)){
  window.addEventListener("load",()=>{
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(reg=>reg.update()).catch(()=>{});
    checkUpdate();
  });
  document.addEventListener("visibilitychange",()=>{
    if(document.visibilityState!=="visible")return;
    checkUpdate();
    navigator.serviceWorker.getRegistration().then(r=>r&&r.update()).catch(()=>{});
  });
}
